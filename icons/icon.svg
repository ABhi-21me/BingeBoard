<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Brutalist red background — sharp corners, no radius -->
  <rect width="128" height="128" fill="#ff2d00" rx="0"/>

  <!-- Thick black border for brutalist edge -->
  <rect x="2" y="2" width="124" height="124" fill="none" stroke="#000" stroke-width="4" rx="0"/>

  <!-- Inner white square frame -->
  <rect x="24" y="24" width="80" height="80" fill="none" stroke="#fff" stroke-width="5" rx="0"/>

  <!-- Bold play triangle — slightly right-offset for optical center -->
  <polygon points="54,38 54,90 94,64" fill="#fff"/>

  <!-- Film-strip notches — top -->
  <rect x="14" y="10" width="8" height="8" fill="#000"/>
  <rect x="32" y="10" width="8" height="8" fill="#000"/>
  <rect x="50" y="10" width="8" height="8" fill="#000"/>
  <rect x="68" y="10" width="8" height="8" fill="#000"/>
  <rect x="86" y="10" width="8" height="8" fill="#000"/>
  <rect x="104" y="10" width="8" height="8" fill="#000"/>

  <!-- Film-strip notches — bottom -->
  <rect x="14" y="110" width="8" height="8" fill="#000"/>
  <rect x="32" y="110" width="8" height="8" fill="#000"/>
  <rect x="50" y="110" width="8" height="8" fill="#000"/>
  <rect x="68" y="110" width="8" height="8" fill="#000"/>
  <rect x="86" y="110" width="8" height="8" fill="#000"/>
  <rect x="104" y="110" width="8" height="8" fill="#000"/>
</svg>
